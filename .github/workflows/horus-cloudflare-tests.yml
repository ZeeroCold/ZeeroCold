name: HORUS Cloudflare Worker Tests

on:
  push:
    branches: [main, master]
    paths:
      - "mcp-tools/cloudflare/**"
      - ".github/workflows/horus-cloudflare-tests.yml"
  pull_request:
    paths:
      - "mcp-tools/cloudflare/**"
      - ".github/workflows/horus-cloudflare-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-tools/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
