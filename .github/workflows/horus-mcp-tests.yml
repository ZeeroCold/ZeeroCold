name: HORUS MCP tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        working-directory: mcp-tools
        run: python -m unittest discover -s tests -v
      - name: Compile
        working-directory: mcp-tools
        run: python -m py_compile server.py tests/test_server.py
